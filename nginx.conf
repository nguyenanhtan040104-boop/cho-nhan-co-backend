# Redirect HTTP -> HTTPS
server {
    listen 80;
    server_name api.chonhanco.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name api.chonhanco.com;

    ssl_certificate     /etc/letsencrypt/live/api.chonhanco.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.chonhanco.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    # Security headers
    add_header X-Content-Type-Options    "nosniff"                          always;
    add_header X-Frame-Options           "DENY"                             always;
    add_header X-XSS-Protection          "1; mode=block"                   always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin"  always;
    add_header Content-Security-Policy   "default-src 'none'; connect-src 'self'" always;

    client_max_body_size 20M;

    location / {
        proxy_pass         http://localhost:3001;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade          $http_upgrade;
        proxy_set_header   Connection       'upgrade';
        proxy_set_header   Host             $host;
        proxy_set_header   X-Real-IP        $remote_addr;
        proxy_set_header   X-Forwarded-For  $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 60s;
    }

    # WebSocket support
    location /messaging {
        proxy_pass         http://localhost:3001;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host       $host;
        proxy_set_header   X-Forwarded-Proto https;
        proxy_read_timeout 86400;
    }

    # Static uploads
    location /uploads/ {
        alias       /home/app/backend/uploads/;
        expires     30d;
        add_header  Cache-Control "public, no-transform";
        add_header  X-Content-Type-Options "nosniff";
    }
}
